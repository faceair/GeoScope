[package]
name = "geoscope"
version = "0.1.0"
description = "A high-performance offline IP and Phone location query desktop application"
authors = ["faceair"]
edition = "2021"
license = "MIT"

[lib]
name = "geoscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipdb = "0.1.4"
parking_lot = "0.12"
rayon = "1.10"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.17.2"
encoding_rs = "0.8.41"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tiny_http = "0.12.0"
dirs = "7.0.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", features = ["NSData"] }
